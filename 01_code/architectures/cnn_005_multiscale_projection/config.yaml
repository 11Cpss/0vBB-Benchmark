model:
  base_channels: 16
  stage_blocks: [2, 2, 2, 2]
  fusion_features: 256
  dropout: 0.1

training:
  batch_size: 8
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  early_stopping_patience: 12
  early_stopping_min_delta: 0.0
  seed: 42
  deterministic: false
  use_amp: true
  amp_precision: auto

output:
  allow_overwrite: false
