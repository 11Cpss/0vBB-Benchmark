architecture_id: hybrid_001_cnn_gnn

data:
  root: /home/klz/Data/zeronu_benchmark/NEXT
  max_files_per_class: 100
  split_seed: 42
  split_fractions: [0.8, 0.1, 0.1]
  num_workers: 0
  balance_training_classes: true
  event_shuffle_buffer_size: 512

representation:
  projection_grid_size: 128
  projection_bin_size: 30.0
  projection_origin: [-1920.0, -1920.0, -120.0]
  projection_input_scale: 100.0
  point_bin_size: 15.0
  coordinate_scale: 1000.0
  max_points: 512

model:
  feature_dim: 2
  image_base_channels: 16
  image_embedding_dim: 128
  graph_hidden_dim: 96
  graph_embedding_dim: 192
  num_graph_layers: 3
  k: 16
  classifier_dim: 192
  dropout: 0.10

training:
  batch_size: 8
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  early_stopping_patience: 12
  early_stopping_min_delta: 0.0
  seed: 42
  deterministic: false
  use_amp: true
  amp_precision: auto
